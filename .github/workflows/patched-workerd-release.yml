name: Patched workerd release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v, e.g. 1.20260610.0-fuse.1"
        required: true
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    if: github.repository != 'cloudflare/workerd'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-64
            runner: ubuntu-22.04
            bazel_config: release_linux
          - asset: darwin-arm64
            runner: macos-15-xlarge
            bazel_config: release_macos
          - asset: darwin-64
            runner: macos-15-xlarge
            bazel_config: release_macos_cross_x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Bazelisk
        run: npm install --global @bazel/bazelisk

      - name: Setup runner
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ""

      - name: Build workerd
        run: |
          bazelisk build \
            --strip=always \
            --config=${{ matrix.bazel_config }} \
            //src/workerd/server:workerd

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          cp bazel-bin/src/workerd/server/workerd workerd-${{ matrix.asset }}
          chmod +x workerd-${{ matrix.asset }}
          gzip -9N workerd-${{ matrix.asset }}
          shasum -a 256 workerd-${{ matrix.asset }}.gz > workerd-${{ matrix.asset }}.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: workerd-${{ matrix.asset }}
          path: |
            workerd-${{ matrix.asset }}.gz
            workerd-${{ matrix.asset }}.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.repository != 'cloudflare/workerd'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Patched workerd v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: assets/*
